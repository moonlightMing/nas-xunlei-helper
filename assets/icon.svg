  <!-- 托盘(蓝) -->
  <rect x="10" y="66" width="108" height="50" rx="16" fill="#4c8dff"/>
  <!-- 托盘进度条意象(白) -->
  <rect x="36" y="84" width="56" height="11" rx="5.5" fill="#ffffff"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 深色圆角底板 -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="#202124"/>
  <!-- 左:上传箭头(白) -->
  <path d="M44 10 L62 34 H52 V62 H36 V34 H26 Z" fill="#ffffff"/>
  <!-- 右:下载箭头(蓝,白描边与底板分离) -->
